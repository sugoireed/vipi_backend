{% extends "contribute/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h2>Sign in to contribute</h2>
  <form method="post">{% csrf_token %}
    {% if form.errors %}<div class="msg error">That email and password don't match.</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label class="lbl" for="id_username">Email</label><input class="field" name="username" id="id_username" autocomplete="username" autofocus required>
    <label class="lbl" for="id_password">Password</label><input class="field" type="password" name="password" id="id_password" autocomplete="current-password" required>
    <div class="actions"><button class="btn btn-primary">Sign in</button></div>
  </form>
  <p class="muted" style="margin-top:12px">Contributing is by invitation. Ask the Vipi! team for an invite link.</p>
</div>
{% endblock %}
